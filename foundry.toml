[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
auto_detect_remappings = false

[profile.default.fuzz]
runs = 256
seed = "0x44c026aa94cf1f7f2d350042e578dcc53619d1c45a9e548e855f975dba844cc4"

[profile.default.invariant]
runs = 64
depth = 64
fail_on_revert = true

[fmt]
line_length = 110
ignore = ["lib/**", "vendor/**"]
